<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jurator film</title>
<style>
  :root {
    --cream: #f8fafc; --paper: #ffffff; --forest: #0f172a; --forest-2: #b45309; --ink: #1e293b; --muted: #64748b;
    --term: #0f1419; --term-2: #1a2029; --tx: #e2e8f0; --red: #ef4444; --green: #4ade80; --amber: #f59e0b;
    --orange: linear-gradient(135deg, #f7931e, #ef5a3c);
    --mono: "SF Mono", Menlo, Monaco, monospace; --sans: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    --serif: "New York", "Iowan Old Style", Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); color: var(--ink); font-family: var(--sans); }
  #bg { position: absolute; inset: -80px; background:
    radial-gradient(1200px 700px at 85% -10%, rgba(247,147,30,.13), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(239,90,60,.08), transparent 60%); }
  #stage { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; display: none; }

  /* top bar */
  #top { position: absolute; top: 34px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
  .brand { font: 700 26px var(--sans); color: var(--forest); letter-spacing: -.01em; display: flex; gap: 14px; align-items: center; }
  .brand i, .mark { width: 34px; height: 34px; border-radius: 50%; display: inline-block; flex: none;
    background: radial-gradient(circle, #f39613 0 39.5%, #fff 40.5% 63.5%, transparent 64.5%), linear-gradient(135deg, #fb8c0a, #f23a2e);
    box-shadow: 0 6px 16px -6px rgba(242,58,46,.45); } /* the Praesidia mark: gradient ring, white ring, orange core */
  .brand em { font-style: normal; color: var(--muted); font-weight: 600; }
  .brand small { font: 600 19px var(--sans); color: var(--muted); padding-left: 14px; border-left: 2px solid rgba(15,23,42,.15); }
  .word { letter-spacing: .04em; }
  .grad { background: var(--orange); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #chip { font: 600 21px var(--sans); color: var(--forest); background: rgba(15,23,42,.08); border: 1px solid rgba(15,23,42,.18); padding: 9px 18px; border-radius: 999px; }
  #mode { font: 600 17px var(--mono); padding: 9px 16px; border-radius: 999px; letter-spacing: .02em; }
  #mode.live { background: var(--forest); color: #f8fafc; }
  #mode.live::before { content: "● "; color: var(--green); }
  #mode.rehearsal { background: #f6e3b4; color: #6a4a07; border: 1px solid #e2c06e; }

  /* terminal */
  .win { position: absolute; left: 50%; top: 112px; width: 1330px; height: 790px; margin-left: -665px; background: var(--term);
    border-radius: 18px; box-shadow: 0 40px 80px -30px rgba(15,20,25,.55), 0 0 0 1px rgba(15,20,25,.4); overflow: hidden;
    transform-origin: 50% 40%; }
  .bar { height: 44px; background: var(--term-2); display: flex; align-items: center; padding: 0 18px; gap: 9px; }
  .bar b { width: 13px; height: 13px; border-radius: 50%; background: #3b4658; }
  .bar span { margin-left: 14px; font: 500 15px var(--mono); color: #8594a8; }
  .vp { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; overflow: hidden; padding: 18px 30px; }
  .txt { font: 19.5px/1.27 var(--mono); color: var(--tx); white-space: pre; position: relative; }
  .ln { height: 1.27em; position: relative; z-index: 1; }
  .ln.hid { visibility: hidden; }
  .cmd { color: #fff; }
  .cmd .p { color: var(--green); font-weight: 700; }
  .caret { display: inline-block; width: .6em; height: 1.05em; background: var(--green); vertical-align: -.15em; }
  .hl { position: absolute; left: -14px; right: -14px; height: 1.27em; border-radius: 6px; background: rgba(233,180,76,.16);
    box-shadow: inset 3px 0 0 var(--amber); z-index: 0; opacity: 0; }
  .b { font-weight: 700; } .d { opacity: .62; }
  .f31,.f91 { color: #ff7b72; } .f32,.f92 { color: #7ee2a8; } .f33,.f93 { color: #f2c66d; } .f34,.f94 { color: #8ab4ff; }
  .f35 { color: #d7a6ff; } .f36 { color: #7fd8d8; } .f37,.f97 { color: #fff; } .f30 { color: #111; }
  .g41 { background: #c8322b; } .g42 { background: #3fae72; } .g43 { background: #e0a93a; }

  /* captions */
  #cap { position: absolute; left: 50%; bottom: 38px; transform: translateX(-50%); max-width: 1480px; text-align: center; z-index: 60;
    font: 500 29px/1.35 var(--sans); color: var(--paper); background: rgb(15,20,25); box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 12px 26px; border-radius: 14px;
    letter-spacing: -.005em; }
  #cap:empty { display: none; }

  /* cards */
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 180px; }
  .kicker { font: 600 22px var(--mono); color: var(--forest-2); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 28px; }
  .h1 { font: 700 112px/1 var(--sans); letter-spacing: -.045em; color: var(--forest); }
  .h2 { font: 400 54px/1.18 var(--serif); color: var(--ink); margin-top: 26px; max-width: 1350px; letter-spacing: -.01em; }
  .h2 em { color: var(--forest-2); }
  .pills { display: flex; gap: 16px; margin-top: 54px; flex-wrap: wrap; }
  .pill { font: 600 25px var(--sans); padding: 16px 26px; border-radius: 16px; background: var(--paper); border: 1px solid rgba(15,23,42,.16);
    box-shadow: 0 10px 30px -18px rgba(15,23,42,.5); opacity: 0; }
  .pill small { display: block; font: 500 18px var(--sans); color: var(--muted); margin-top: 6px; }
  .fine { position: absolute; left: 180px; right: 180px; bottom: 150px; font: 400 18px/1.45 var(--sans); color: var(--muted); }

  /* hero */
  .hero-box { position: absolute; left: 50%; top: 255px; transform: translateX(-50%) scale(.96); background: var(--term); border-radius: 18px;
    padding: 26px 34px; font: 21px/1.26 var(--mono); color: var(--tx); white-space: pre; box-shadow: 0 50px 90px -30px rgba(15,20,25,.6); }
  .hero-title { position: absolute; top: 118px; left: 0; right: 0; text-align: center; font: 700 62px/1.05 var(--sans); letter-spacing: -.03em; color: var(--forest); }
  .hero-title span { color: var(--red); }

  /* investigator */
  .inv { position: absolute; top: 112px; left: 110px; width: 1080px; height: 800px; overflow: hidden; border-radius: 16px; background: #fff;
    box-shadow: 0 40px 80px -30px rgba(15,20,25,.45), 0 0 0 1px rgba(15,23,42,.15); }
  .inv img { position: absolute; left: 0; top: 0; width: 1080px; opacity: 0; }
  .side { position: absolute; left: 1250px; top: 150px; width: 560px; }
  .side .tag { font: 600 17px var(--mono); color: var(--forest); background: rgba(15,23,42,.08); padding: 8px 14px; border-radius: 10px; display: inline-block; line-height: 1.5; }
  .fact { margin-top: 30px; padding: 22px 24px; border-radius: 16px; background: var(--paper); border: 1px solid rgba(15,23,42,.14);
    opacity: 0; }
  .fact b { display: block; font: 700 34px var(--sans); letter-spacing: -.02em; }
  .fact span { font: 500 20px/1.4 var(--sans); color: var(--muted); }
  .red { color: var(--red); } .grn { color: #2f8f5b; }

  /* step badge on the terminal bar */
  .bar .ai { margin-left: auto; font: 600 15px var(--mono); padding: 5px 12px; border-radius: 999px; letter-spacing: .02em; }
  .bar .ai.ai-meta { background: rgba(138,180,255,.16); color: #b9d0ff; box-shadow: inset 0 0 0 1px rgba(138,180,255,.35); }
  .bar .ai.ai-meta::before { content: "◆ "; color: #8ab4ff; }
  .bar .ai.ai-rules { background: rgba(126,226,168,.12); color: #9fe9bf; box-shadow: inset 0 0 0 1px rgba(126,226,168,.3); }

  /* two products */
  .duo { display: flex; gap: 22px; margin-top: 48px; }
  .prod { flex: 1; max-width: 640px; padding: 26px 30px; border-radius: 20px; background: var(--paper); border: 1px solid rgba(15,23,42,.16);
    box-shadow: 0 16px 40px -24px rgba(15,23,42,.55); opacity: 0; }
  .prod b { display: block; font: 700 40px var(--sans); letter-spacing: -.03em; color: var(--forest); }
  .prod p { font: 500 25px/1.3 var(--sans); color: var(--ink); margin-top: 8px; }
  .prod small { display: block; font: 600 17px var(--mono); color: var(--muted); margin-top: 14px; letter-spacing: .02em; }

  /* meta */
  .meta { position: absolute; inset: 0; padding: 165px 150px 0; }
  .meta .kicker { margin-bottom: 18px; }
  .meta .h1 { font-size: 84px; }
  .api { margin-top: 40px; display: flex; align-items: center; gap: 18px; font: 600 24px var(--mono); color: var(--paper);
    background: var(--forest); border-radius: 16px; padding: 18px 26px; width: fit-content; opacity: 0; }
  .api span { font: 500 18px var(--mono); color: #94a3b8; }
  .models { display: flex; gap: 22px; margin-top: 26px; }
  .model { flex: 1; border-radius: 20px; padding: 24px 28px; background: var(--paper); border: 1px solid rgba(15,23,42,.16); opacity: 0;
    box-shadow: 0 16px 40px -24px rgba(15,23,42,.55); }
  .model b { font: 700 36px var(--mono); color: #2b56b8; letter-spacing: -.01em; }
  .model em { font: 500 19px var(--sans); color: var(--muted); font-style: normal; margin-left: 10px; }
  .model ul { margin: 16px 0 0; padding-left: 26px; font: 500 27px/1.55 var(--sans); }
  .feat { display: flex; gap: 12px; margin-top: 24px; opacity: 0; }
  .feat i { font: 600 18px var(--mono); font-style: normal; padding: 9px 16px; border-radius: 999px; background: rgba(43,86,184,.08); color: #2b56b8; border: 1px solid rgba(43,86,184,.22); }
  .flow { margin-top: 44px; font: 700 40px var(--sans); letter-spacing: -.02em; color: var(--forest); opacity: 0; }
  .flow span { color: var(--muted); font-weight: 500; }

  /* end */
  .tiles { display: flex; gap: 18px; margin-top: 48px; }
  .tile { background: var(--forest); color: #f8fafc; border-radius: 18px; padding: 22px 28px; min-width: 210px; }
  .tile b { display: block; font: 700 46px var(--sans); letter-spacing: -.03em; }
  .tile span { font: 500 19px var(--sans); opacity: .8; }
  .logo { display: flex; align-items: center; gap: 30px; } .logo .mark { width: 104px; height: 104px; }
  .url { margin-top: 52px; font: 600 40px var(--mono); color: var(--forest); }
  .rc-chip { padding: 16px 22px; border-radius: 16px; background: var(--paper); border: 1px solid rgba(15,23,42,.14); box-shadow: 0 14px 34px -22px rgba(15,23,42,.5); opacity: 0; }
  .rc-chip b { display: block; font: 700 27px var(--sans); letter-spacing: -.02em; color: var(--forest); } .rc-chip span { font: 500 19px var(--sans); color: var(--muted); }
  .rc-chip.live { border-color: rgba(242,58,46,.45); } .rc-chip.live b { color: #d9481f; }
  .rc-node { display: flex; align-items: center; gap: 18px; width: 380px; padding: 22px 26px; border-radius: 20px; background: var(--term); opacity: 0; }
  .rc-node b { display: block; font: 700 34px var(--sans); color: #fff; letter-spacing: -.02em; } .rc-node span { font: 500 17px var(--mono); color: #94a3b8; }
  .rc-l { font: 600 18px var(--mono); color: var(--forest-2); letter-spacing: .14em; text-transform: uppercase; opacity: 0; }
  .rc-ans i { font: 600 21px var(--mono); font-style: normal; padding: 13px 20px; border-radius: 999px; background: var(--forest); color: #f8fafc; opacity: 0; }
  .wm { position: absolute; right: 64px; top: 84px; font: 700 17px var(--mono); color: #8a6512; opacity: .75; letter-spacing: .1em; z-index: 70; }
</style>
</head>
<body>
<div id="bg"></div><div id="stage"></div>
<div id="top"><div class="brand"><i></i><span class="word">PRAESIDIA<em>.AI</em></span><small>Jurator</small></div><div id="chip"></div><div id="mode"></div></div>
<div id="cap"></div>
<script>
const FILM = /*FILM*/null;
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const stage = document.getElementById('stage'), cap = document.getElementById('cap'), chip = document.getElementById('chip'), mode = document.getElementById('mode');
mode.className = FILM.live ? 'live' : 'rehearsal';
mode.textContent = FILM.live ? 'muse-wonder-1.0 · live take' : 'REHEARSAL · scripted answers';
// The wordmark is written PRAESIDIA.AI; the narration says only "Praesidia".
const DOT = '.AI';
if (!FILM.live) document.body.append($('<div class="wm">SCRIPTED REHEARSAL — NOT A LIVE TAKE</div>'));
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

// When a phrase is spoken: its share of the narration's characters (the same estimate the captions use).
const cue = (s, w, dflt) => {
  const m = s.marks && s.marks.find((x) => x.text.includes(w));
  if (m) return FILM.voiceLead + m.start + (m.end - m.start) * m.text.indexOf(w) / m.text.length;
  const k = s.voice.indexOf(w); return k < 0 ? dflt : FILM.voiceLead + s.voiceSec * k / s.voice.length;
};

// Captions: sentences of the narration, each timed by its share of the characters.
function captionAt(s, local) {
  const t = local - FILM.voiceLead; if (t < 0 || t > s.voiceSec + .2) return '';
  if (s.marks) { let m = s.marks[0]; for (const x of s.marks) if (t >= x.start) m = x; return m.text; }
  const parts = s.voice.match(/[^.!?:]+[.!?:]?(\s|$)/g).map((x) => x.trim()).filter(Boolean);
  const merged = []; for (const p of parts) (merged.length && merged.at(-1).length + p.length < 95) ? merged[merged.length - 1] += ' ' + p : merged.push(p);
  const total = merged.reduce((a, p) => a + p.length, 0); let acc = 0;
  for (const p of merged) { acc += p.length; if (t <= s.voiceSec * acc / total) return p; }
  return merged.at(-1);
}

// Every frame is a pure function of t (seconds): render(t) can be called in any order, so the film can be
// captured frame by frame at an exact 30 fps instead of screen-recorded.
const clamp = (x) => Math.max(0, Math.min(1, x));
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeInOut = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
// Triangle-weighted average of a step function over the last 0.6 s: a smooth glide with no hidden state.
const smooth = (fn, l) => { let a = 0, w = 0; for (let j = 0; j < 12; j++) { const k = 12 - j; a += k * fn(Math.max(0, l - j * .05)); w += k; } return a / w; };
const setStyle = (el, k, v) => { if (el.style[k] !== v) el.style[k] = v; };

// ---------- terminal scene
function buildTerm(s) {
  const el = $(`<div class="scene"><div class="win"><div class="bar"><b></b><b></b><b></b><span>${esc(s.win || 'acme-notes — zsh')}</span>${s.ai ? `<i class="ai ${/^no AI/.test(s.ai) || /^rules/.test(s.ai) ? 'ai-rules' : 'ai-meta'}">${esc(s.ai)}</i>` : ''}</div><div class="vp"><div class="txt"><div class="hl"></div></div></div></div></div>`);
  const txt = el.querySelector('.txt'), win = el.querySelector('.win'), hl = txt.querySelector('.hl'), rows = [];
  for (const bi of s.blocks) {
    const b = FILM.blocks[bi];
    b.html.forEach((h, k) => {
      const isCmd = !b.comment && k === 0, row = $(`<div class="ln hid"></div>`);
      if (isCmd) row.innerHTML = `<span class="cmd"><span class="p">$ </span><span class="ty"></span></span>`; else row.innerHTML = h;
      txt.append(row); rows.push({ row, cmd: isCmd ? b.cmd : null, text: b.text[k], ty: isCmd ? row.querySelector('.ty') : null });
    });
    const gap = $('<div class="ln hid"> </div>'); txt.append(gap); rows.push({ row: gap, text: '' });
  }
  // Schedule: per block, type the command then reveal its lines; then walk the focus list.
  const dur = s.duration, budget = Math.min(dur * .42, (3.2 + rows.length * .02) * (FILM.corvane ? .55 : 1)); // corvane cut: faster output reveal, more time on focus
  const typeSpeed = 42; let t = .35;
  for (const r of rows) {
    if (r.cmd) { r.typeT = Math.min(1.6, r.cmd.length / typeSpeed); r.at = t; t += r.typeT + .25; }
    else { r.at = t; t += budget / rows.length; }
  }
  const lineH = 19.5 * 1.27, vpH = 790 - 44 - 36;
  // Each focus string is found after the previous one (so 'Policy ' means the privacy.01 box's line), else anywhere.
  let from = 0; const focus = (s.focus || []).map((f) => {
    const has = (r, k) => r.text && r.text.includes(f);
    let i = rows.findIndex((r, k) => k >= from && has(r, k)); if (i < 0) i = rows.findIndex(has);
    if (i >= 0) from = i; return i;
  }).filter((i) => i >= 0);
  const fStart = t + .2, fSpan = Math.max(1.1, (dur - .9 - fStart) / Math.max(1, focus.length));
  const fiAt = (l) => (focus.length && l >= fStart) ? Math.min(focus.length - 1, Math.floor((l - fStart) / fSpan)) : -1;
  const lastAt = (l) => { let last = -1; for (let k = 0; k < rows.length && rows[k].at <= l; k++) last = k; return last; };
  const maxScroll = Math.max(0, rows.length * lineH - vpH + lineH);
  const scrollAt = (l) => {
    const fi = fiAt(l);
    if (fi >= 0) return Math.max(0, Math.min(focus[fi] * lineH - vpH * .38, maxScroll));
    return Math.max(0, (lastAt(l) + 2) * lineH - vpH);
  };
  const hlAt = (l) => (focus[Math.max(0, fiAt(l))] ?? 0) * lineH;
  const bar = el.querySelector('.bar'), labs = [...bar.querySelectorAll('span, i')];
  return { el, s, win, bar, labs, vp: el.querySelector('.vp'), update(l) {
    for (const r of rows) {
      r.row.classList.toggle('hid', l < r.at);
      if (r.cmd && l >= r.at) {
        const n = Math.min(r.cmd.length, Math.floor((l - r.at) / r.typeT * r.cmd.length));
        const caret = n < r.cmd.length ? `<span class="caret" style="opacity:${Math.floor(l * 2.4) % 2 ? .25 : 1}"></span>` : '';
        const html = esc(r.cmd.slice(0, n)) + caret;
        if (r.ty.innerHTML !== html) r.ty.innerHTML = html;
      }
    }
    setStyle(txt, 'transform', `translateY(${-smooth(scrollAt, l).toFixed(1)}px)`);
    setStyle(hl, 'top', smooth(hlAt, l).toFixed(1) + 'px');
    setStyle(hl, 'opacity', smooth((x) => fiAt(x) >= 0 ? 1 : 0, l).toFixed(3));
    setStyle(win, 'transform', s.zoom ? `scale(${(1 + .12 * easeInOut((l - fStart) / 1.1)).toFixed(4)})` : '');
  } };
}

// ---------- cards
function buildHero(s) {
  const b = FILM.blocks[s.blocks[0]];
  const tops = b.text.map((x, k) => x.startsWith('┏') ? k : -1).filter((k) => k >= 0);
  const a = tops.find((k) => b.text[k].includes(s.heroId || 'privacy.01')) ?? tops[0], z = b.text.findIndex((x, k) => k > a && x.startsWith('┗'));
  const lines = b.html.slice(a, z + 1).join('\n');
  const el = $(`<div class="scene"><div class="hero-title">${s.title || 'An agent broke a privacy promise. <span>Caught before the push.</span>'}</div><div class="hero-box">${lines}</div></div>`);
  const box = el.querySelector('.hero-box'), title = el.querySelector('.hero-title');
  return { el, s, update(l) {
    setStyle(box, 'transform', `translateX(-50%) scale(${(.96 + .07 * easeOut(l / 7)).toFixed(4)})`);
    setStyle(title, 'opacity', easeOut((l - .3) / .8).toFixed(3));
  } };
}
function buildTitle(s) {
  const el = $(`<div class="scene"><div class="card">
    <div class="kicker">Meta AI Developer Hackathon · Startup track</div>
    <div class="h1 logo"><i class="mark"></i><span><span class="word">PRAESIDIA</span><span class="grad">${DOT}</span></span></div>
    <div class="h2">Proof for what AI agents do, <em>built on Meta Muse</em>.</div>
    <div class="duo">
      <div class="prod"><b>Jurator</b><p>Before code ships: every change checked against the promises in your policies.</p><small>policies → promises → rules · coding agent + git push · chat</small></div>
      <div class="prod"><b>Investigator</b><p>While agents run: proof that revoked agent work really stops.</p><small>live experiments · destination receipts · bounded repair</small></div>
    </div></div>
    <div class="fine">${s.fine ? esc(s.fine) : "Praesidia Investigator (published 2 Nov 2026) is earlier work. Jurator was built in the hackathon sprint and reuses Investigator's Meta Responses provider (about 1,170 lines). Built with Meta Muse models; not a Meta product."}</div></div>`);
  const cards = [...el.querySelectorAll('.prod')];
  return { el, s, update(l) { cards.forEach((p, i) => { const k = easeOut((l - [cue(s, 'Jurator', 5), cue(s, 'Investigator', 8)][i]) / .6); setStyle(p, 'opacity', k.toFixed(3)); setStyle(p, 'transform', `translateY(${(16 * (1 - k)).toFixed(1)}px)`); }); } };
}
function buildMeta(s) {
  const el = $(`<div class="scene"><div class="meta">
    <div class="kicker">How we use Meta</div>
    <div class="h1">One API. Two Muse models.</div>
    <div class="api">Meta Responses API <span>api.meta.ai/v1/responses</span></div>
    <div class="models">
      <div class="model"><b>muse-wonder-1.0</b><em>the reasoning</em><ul><li>policies → numbered promises with exact quotes</li><li>writes a rule for each promise, binds it to code</li><li>drives Investigator's experiments via tool calls</li></ul></div>
      <div class="model"><b>muse-spark-1.3</b><em>quick and cheap</em><ul><li>plain-words summary of every finding</li><li>the facts in it come from the program</li></ul></div>
    </div>
    <div class="feat"><i>function calling</i><i>JSON-schema structured output</i><i>reasoning effort</i><i>cost tracked per run</i></div>
    <div class="flow">Models propose <span>→</span> the program decides <span>→</span> rules run with no AI</div>
  </div></div>`);
  const items = [el.querySelector('.api'), ...el.querySelectorAll('.model'), el.querySelector('.feat'), el.querySelector('.flow')];

  setStyle(bg, 'transform', `translate(${(50 * Math.sin(t * .11)).toFixed(1)}px,${(36 * Math.cos(t * .083)).toFixed(1)}px)`); // slow drifting light
  const c = s.kind === 'intro' ? '' : captionAt(s, local); if (cap.textContent !== c) cap.textContent = c;
};
window.play = () => {
  const t0 = performance.now();
  const frame = () => { const t = (performance.now() - t0) / 1000; window.render(Math.min(t, FILM.total)); if (t >= FILM.total) window.done = true; else requestAnimationFrame(frame); };
  requestAnimationFrame(frame);
};
window.render(0);
if (location.hash === '#preview') window.play();
</script>
